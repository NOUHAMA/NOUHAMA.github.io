<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power BI Projects</title>

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #e6ecff, #f7f9ff);
            --card-gradient: linear-gradient(135deg, #ffffff, #f9faff);
            --accent: #a5b4fc;
            --text-dark: #2d2d2d;
            --text-light: #6b7280;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            background: var(--bg-gradient);
            margin: 0;
            padding: 40px 20px;
            color: var(--text-dark);
        }

        h1 {
            font-size: 3em;
            font-weight: 700;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.2em;
            max-width: 700px;
            margin: 10px auto 40px;
            color: var(--text-light);
        }

        .projects {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 35px;
        }

        .project-card {
            background: var(--card-gradient);
            border-radius: 16px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
            width: 240px;
            padding: 25px;
            text-align: center;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .project-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.12);
        }

        .project-card h3 {
            font-size: 1.5em;
            margin-bottom: 12px;
            color: var(--text-dark);
        }

        .project-card a {
            text-decoration: none;
            color: #6c7ae0;
            font-weight: bold;
            font-size: 1.05em;
            display: inline-block;
            margin-top: 10px;
            transition: color 0.2s ease;
        }

        .project-card a:hover {
            color: var(--accent);
        }

        .back-home {
            display: inline-block;
            margin-top: 50px;
            font-size: 1.1em;
            color: #6c7ae0;
            font-weight: bold;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .back-home:hover {
            color: var(--accent);
        }
    </style>
</head>

<body>

<h1>Power BI Projects</h1>
<p>Interactive dashboards built using Power BI for data analysis and business insights.</p>

<div class="projects">
    <div class="project-card">
        <h3>Dashboard 1</h3>
        <a href="dashboard1.html" target="_blank">View Dashboard</a>
    </div>

    <div class="project-card">
        <h3>Dashboard 2</h3>
        <a href="dashboard2.html" target="_blank">View Dashboard</a>
    </div>

    <div class="project-card">
        <h3>Dashboard 3</h3>
        <a href="dashboard3.html" target="_blank">View Dashboard</a>
    </div>

    <div class="project-card">
        <h3>Dashboard 4</h3>
        <a href="dashboard4.html" target="_blank">View Dashboard</a>
    </div>
</div>

<a href="../index.html" class="back-home">← Back to Home</a>

</body>
</html>
