<style>
:root {
    --bg-gradient: linear-gradient(135deg, #e6ecff, #f7f9ff);
    --card-gradient: linear-gradient(135deg, #ffffff, #f9faff);
    --accent: #a5b4fc;
    --text-dark: #2d2d2d;
    --text-light: #6b7280;
}

/* PAGE */
body {
    font-family: 'Segoe UI', Arial, sans-serif;
    text-align: center;
    background: var(--bg-gradient);
    margin: 0;
    padding: 40px 20px;
    color: var(--text-dark);
}

h1 {
    font-size: 3em;
    font-weight: 700;
    margin: 0 0 10px;
}

p {
    font-size: 1.2em;
    max-width: 750px;
    margin: 10px auto 50px;
    color: var(--text-light);
}

/* GRID */
.projects {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 35px;
}

/* CARD */
.project-card {
    background: var(--card-gradient);
    border-radius: 16px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
    width: 260px;
    padding: 25px;
    text-align: center;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.project-card:hover {
    transform: translateY(-6px) scale(1.02);
    box-shadow: 0 12px 26px rgba(0, 0, 0, 0.12);
}

.project-card h3 {
    font-size: 1.6em;
    margin-bottom: 15px;
}

/* PROJECT LIST */
.project-list {
    list-style: none;
    padding: 0;
    margin: 0;
}

.project-list li {
    margin: 10px 0;
}

.project-list a {
    text-decoration: none;
    color: #4f46e5;
    font-weight: 500;
    transition: color 0.2s ease;
}

.project-list a:hover {
    color: var(--accent);
}

/* BACK BUTTON */
.back-home {
    display: inline-block;
    margin-top: 60px;
    font-size: 1.1em;
    color: #4f46e5;
    font-weight: bold;
    text-decoration: none;
    transition: color 0.2s ease;
}

.back-home:hover {
    color: var(--accent);
}
</style>
</head>
