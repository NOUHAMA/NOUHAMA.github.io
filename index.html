<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Pages Portfolio</title>

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #e6ecff, #f7f9ff);
            --card-gradient: linear-gradient(135deg, #ffffff, #f9faff);
            --accent: #a5b4fc;
            --text-dark: #2d2d2d;
            --text-light: #6b7280;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            background: var(--bg-gradient);
            margin: 0;
            padding: 0;
            color: var(--text-dark);
        }

        header {
            padding: 60px 20px;
            background: transparent;
        }

        h1 {
            margin: 0;
            font-size: 3em;
            font-weight: 700;
        }

        h2.subtitle {
            font-weight: 300;
            margin-top: 10px;
            color: var(--text-light);
        }

        p {
            font-size: 1.3em;
            max-width: 700px;
            margin: 15px auto 0;
            color: var(--text-light);
        }

        .projects {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin: 50px 0;
            gap: 35px;
        }

        .project-card {
            background: var(--card-gradient);
            border-radius: 16px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
            width: 230px;
            padding: 25px;
            text-align: center;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            cursor: pointer;
            color: var(--text-dark);
        }

        .project-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.12);
        }

        .project-card h2 {
            font-size: 1.6em;
            margin-bottom: 10px;
        }

        .project-card a {
            text-decoration: none;
            color: #6c7ae0;
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }

        .project-card a:hover {
            color: var(--accent);
        }
    </style>
</head>

<body>

<header>
    <h1>Nouha MAACH</h1>
    <h2 class="subtitle">Financial Analyst</h2>
    <p>Welcome to my portfolio! Here you'll find my work in data analysis, coding, and visualization.</p>
</header>

<div class="projects">
    <div class="project-card">
        <h2>Python</h2>
        <a href="Python/index.html" target="_blank">View Projects</a>
    </div>


    <div class="project-card">
        <h2>Contact</h2>
        <a href="Contact/index.html" target="_blank">Get in Touch</a>
    </div>
</div>

</body>
</html>
