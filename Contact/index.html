<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #6a11cb, #2575fc);
            --card-gradient: linear-gradient(135deg, #ffffff, #f0f4ff);
            --accent: #ffca28;
            --text-dark: #1a1a1a;
            --text-light: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            background: var(--bg-gradient);
            margin: 0;
            padding: 60px 20px;
            color: var(--text-light);
        }

        h1 {
            font-size: 3em;
            font-weight: 700;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.2em;
            opacity: 0.9;
            margin: 12px 0;
        }

        a {
            color: var(--accent);
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s ease;
        }

        a:hover {
            opacity: 0.8;
        }

        .contact-box {
            background: var(--card-gradient);
            border-radius: 14px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.25);
            padding: 35px;
            max-width: 450px;
            margin: 50px auto;
            color: var(--text-dark);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .contact-box:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 12px 26px rgba(0,0,0,0.3);
        }

        .back-home {
            display: inline-block;
            margin-top: 40px;
            padding: 12px 26px;
            font-size: 1.1em;
            border-radius: 10px;
            border: 2px solid var(--accent);
            color: var(--text-light);
            transition: 0.25s ease;
        }

        .back-home:hover {
            background: var(--accent);
            color: var(--text-dark);
        }
    </style>
</head>

<body>

    <h1>Contact Me</h1>

    <div class="contact-box">
        <p>📧 <strong>Email</strong><br>
            <a href="mailto:maach.nouha@gmail.com">maach.nouha@gmail.com</a>
        </p>

        <p>💼 <strong>LinkedIn</strong><br>
            <a href="https://www.linkedin.com/in/nouha-maach-371970183/" target="_blank">
                linkedin.com/in/nouha-maach-371970183
            </a>
        </p>

        <p>📍 Feel free to reach out for collaborations, projects, or questions!</p>
    </div>

    <a href="../index.html" class="back-home">← Back to Home</a>

</body>
</html>
