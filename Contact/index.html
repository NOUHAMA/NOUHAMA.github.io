<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #e6ecff, #f7f9ff);
            --card-gradient: linear-gradient(135deg, #ffffff, #f9faff);
            --accent: #a5b4fc;
            --text-dark: #2d2d2d;
            --text-light: #6b7280;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            background: var(--bg-gradient);
            margin: 0;
            padding: 60px 20px;
            color: var(--text-dark);
        }

        h1 {
            font-size: 3em;
            font-weight: 700;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.2em;
            margin: 12px 0;
            color: var(--text-light);
        }

        a {
            color: #6c7ae0;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s ease;
        }

        a:hover {
            color: var(--accent);
        }

        .contact-box {
            background: var(--card-gradient);
            border-radius: 16px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
            padding: 35px;
            max-width: 450px;
            margin: 50px auto;
            color: var(--text-dark);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .contact-box:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.12);
        }

        .back-home {
            display: inline-block;
            margin-top: 40px;
            padding: 12px 26px;
            font-size: 1.05em;
            border-radius: 10px;
            border: 2px solid #6c7ae0;
            color: #6c7ae0;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.25s ease;
        }

        .back-home:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--text-dark);
        }
    </style>
</head>

<body>

    <h1>Contact Me</h1>

    <div class="contact-box">
        <p>📧 <strong>Email</strong><br>
            <a href="mailto:maach.nouha@gmail.com">maach.nouha@gmail.com</a>
        </p>

        <p>💼 <strong>LinkedIn</strong><br>
            <a href="https://www.linkedin.com/in/nouha-maach-371970183/" target="_blank">
                linkedin.com/in/nouha-maach-371970183
            </a>
        </p>

        <p>📍 Feel free to reach out for collaborations, projects, or questions!</p>
    </div>

    <a href="../index.html" class="back-home">← Back to Home</a>

</body>
</html>
